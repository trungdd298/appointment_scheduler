openapi: 3.0.3
info:
  title: Keyloop Unified Service Scheduler API
  version: "1.0.0"
  description: >
    Scenario A — Resource-constrained appointment booking with a two-phase
    hold/confirm flow, browse-then-commit availability search, and
    resource-unavailability reconciliation. See design-decisions.md for the
    reasoning behind these API decisions.

servers:
  - url: https://api.example.com/v1

tags:
  - name: Availability
  - name: Appointments
  - name: Ops
  - name: Integrations
    description: Internal endpoints used by other services (mocked within the scope of this assessment)

paths:
  # ---------------------------------------------------------------------
  # Availability — browse before committing
  # ---------------------------------------------------------------------
  /dealerships/{dealershipId}/availability:
    get:
      tags: [Availability]
      summary: Find feasible options (time + technician) near the desired time
      description: >
        No locking, no holding. This is only a suggestion at query time — it
        can go stale immediately after being returned. The client must call
        this endpoint again if POST /appointments/hold returns 409
        SLOT_NO_LONGER_AVAILABLE.
      parameters:
        - name: dealershipId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: vehicleId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: serviceTypeId
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: near
          in: query
          required: true
          description: Desired time (ISO 8601, with timezone)
          schema: { type: string, format: date-time }
        - name: windowHours
          in: query
          required: false
          description: Search range around the desired time
          schema: { type: integer, default: 2, minimum: 1, maximum: 12 }
      responses:
        "200":
          description: List of feasible slots (may be empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AvailabilitySlot" }
        "404":
          description: Dealership/vehicle/serviceType not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------
  # Appointments — hold / confirm flow
  # ---------------------------------------------------------------------
  /appointments/hold:
    post:
      tags: [Appointments]
      summary: Temporarily reserve (5-minute TTL) a specific slot
      description: >
        The server chooses the Bay itself (hidden from the client); the
        technicianId is specified by the client (taken from the
        GET /availability results). Correctness does not depend on the
        prior availability data — the server always re-runs the
        candidate-search + insert-retry logic independently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldRequest" }
      responses:
        "201":
          description: Hold created successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "409":
          description: Slot no longer feasible (rare race condition, or the technician was just taken)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Technician is not qualified for the requested service type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /appointments/{holdId}/confirm:
    post:
      tags: [Appointments]
      summary: Confirm a hold, transitioning it to CONFIRMED
      parameters:
        - name: holdId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [holdToken]
              properties:
                holdToken:
                  type: string
                  format: uuid
                  description: Idempotency key — returned by the /hold response
      responses:
        "200":
          description: Now CONFIRMED (idempotent — calling again with the same token returns the same result)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "404":
          description: Hold not found or token mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "410":
          description: Hold has expired (past the 5-minute TTL)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /appointments/{id}:
    get:
      tags: [Appointments]
      summary: View details of a single appointment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /appointments/{id}/cancel:
    post:
      tags: [Appointments]
      summary: Cancel an appointment (proactively, by the customer or ops)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Now CANCELLED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /appointments:
    get:
      tags: [Appointments, Integrations]
      summary: List appointments by filter
      description: >
        Supports two use-case groups: (1) the Ops queue
        (?status=NEEDS_ATTENTION), and (2) forward-compatibility for
        Scenario D / the Document Viewer (?vin=...) — the Scheduler acts as
        one of the data sources the Document Viewer would aggregate in the
        real Keyloop system.
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/AppointmentStatus" }
        - name: dealershipId
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: vin
          in: query
          required: false
          description: Search by vehicle VIN (used by the future Document Viewer)
          schema: { type: string }
      responses:
        "200":
          description: OK — sorted by start_time ASC by default
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Appointment" }

  # ---------------------------------------------------------------------
  # Ops — resolving NEEDS_ATTENTION
  # ---------------------------------------------------------------------
  /appointments/{id}/reassign-technician:
    post:
      tags: [Ops]
      summary: Ops resolves a NEEDS_ATTENTION appointment by reassigning the technician
      description: >
        Only valid while the appointment is in NEEDS_ATTENTION status.
        Reassigning the technician is a deliberate human action (never
        automatic), since the technician is an explicit customer choice.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [technicianId]
              properties:
                technicianId: { type: integer, format: int64 }
      responses:
        "200":
          description: Transitioned back to CONFIRMED with the new technician
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Appointment" }
        "409":
          description: The new technician is not available at that time
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ---------------------------------------------------------------------
  # Integrations — receiving events from external systems (mocked for this assessment)
  # ---------------------------------------------------------------------
  /internal/resource-unavailability:
    post:
      tags: [Integrations]
      summary: Receive a resource-unavailability report (from the Staff/Facility system, mocked)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResourceUnavailability" }
      responses:
        "201":
          description: Recorded, and detection has run for affected appointments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResourceUnavailability" }
        "200":
          description: Event already processed previously (idempotent via externalEventId)

components:
  schemas:
    AvailabilitySlot:
      type: object
      properties:
        startTime: { type: string, format: date-time }
        technicianId: { type: integer, format: int64 }
        technicianName: { type: string }

    HoldRequest:
      type: object
      required: [dealershipId, vehicleId, customerId, serviceTypeId, startTime, technicianId]
      properties:
        dealershipId: { type: integer, format: int64 }
        vehicleId: { type: integer, format: int64 }
        customerId: { type: integer, format: int64 }
        serviceTypeId: { type: integer, format: int64 }
        startTime: { type: string, format: date-time }
        technicianId: { type: integer, format: int64 }

    AppointmentStatus:
      type: string
      enum: [HELD, CONFIRMED, NEEDS_ATTENTION, EXPIRED, CANCELLED]

    Appointment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        dealershipId: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/AppointmentStatus" }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        vehicleId: { type: integer, format: int64 }
        vin: { type: string }
        customerId: { type: integer, format: int64 }
        serviceTypeId: { type: integer, format: int64 }
        serviceTypeName: { type: string }
        bayId: { type: integer, format: int64 }
        bayLabel: { type: string }
        technicianId: { type: integer, format: int64 }
        technicianName: { type: string }
        holdToken:
          type: string
          format: uuid
          description: Only returned when status = HELD
        expiresAt:
          type: string
          format: date-time
          description: Only meaningful when status = HELD
        needsAttentionReason: { type: string }

    ResourceUnavailability:
      type: object
      required: [resourceType, resourceId, startTime, source, externalEventId]
      properties:
        id: { type: integer, format: int64, readOnly: true }
        resourceType: { type: string, enum: [BAY, TECHNICIAN] }
        resourceId: { type: integer, format: int64 }
        startTime: { type: string, format: date-time }
        endTime:
          type: string
          format: date-time
          nullable: true
          description: null = open-ended (e.g. terminated employment)
        reason: { type: string }
        source:
          type: string
          enum: [STAFF_SYSTEM, TECHNICIAN_SELF, MANAGER_MANUAL, FACILITY_SYSTEM]
        externalEventId:
          type: string
          description: Idempotency key — prevents processing the same external event twice

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          enum:
            - SLOT_NO_LONGER_AVAILABLE
            - HOLD_EXPIRED
            - HOLD_TOKEN_MISMATCH
            - TECHNICIAN_NOT_QUALIFIED
            - NOT_FOUND
            - VALIDATION_ERROR
        message: { type: string }
