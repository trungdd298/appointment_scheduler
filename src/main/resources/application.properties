spring.application.name=appointment_scheduler

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/appointment_scheduler}
spring.datasource.username=${DB_USERNAME:appointment_scheduler}
spring.datasource.password=${DB_PASSWORD:appointment_scheduler}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.locations=classpath:db/migration
